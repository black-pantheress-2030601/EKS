AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EKS Cluster with Bottlerocket AMI managed node group, Pod Identity, and EKS Update Operator IAM role.
  The Update Operator runs on the system node group alongside other cluster tooling.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  ClusterName:
    Type: String
    Default: eks-cluster
    Description: Name of the EKS cluster.

  KubernetesVersion:
    Type: String
    Default: "1.30"
    AllowedValues: ["1.28", "1.29", "1.30"]
    Description: Kubernetes version for the control plane.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the cluster into.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two private subnets in different AZs for node groups
      and the control plane ENIs.

  NodeInstanceType:
    Type: String
    Default: m5.large
    Description: EC2 instance type for the system node group.

  NodeGroupDesiredSize:
    Type: Number
    Default: 2

  NodeGroupMinSize:
    Type: Number
    Default: 1

  NodeGroupMaxSize:
    Type: Number
    Default: 5

  EnablePrivateEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]

  EnvironmentTag:
    Type: String
    Default: production


# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── Security Groups ────────────────────────────────────────────────────────

  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Control plane SG for ${ClusterName}"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-cluster-sg"
        - Key: Environment
          Value: !Ref EnvironmentTag

  NodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Node SG for ${ClusterName}"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-node-sg"
        - Key: Environment
          Value: !Ref EnvironmentTag

  # Allow nodes to communicate with each other
  NodeToNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref NodeSecurityGroup
      Description: Node-to-node all traffic

  # Allow control plane to reach nodes (kubelet, metrics)
  ControlPlaneToNodeIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 1025
      ToPort: 65535
      SourceSecurityGroupId: !Ref ClusterSecurityGroup
      Description: Control plane to node ephemeral ports

  ControlPlaneToNodeIngress443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodeSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref ClusterSecurityGroup
      Description: Control plane to node HTTPS

  # Allow nodes to reach control plane
  NodeToControlPlaneIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref NodeSecurityGroup
      Description: Nodes to API server HTTPS

  # ── IAM: Cluster Role ──────────────────────────────────────────────────────

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ── IAM: Node Role ─────────────────────────────────────────────────────────

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ── IAM: Pod Identity Role for EKS Update Operator ────────────────────────
  #
  # EKS Pod Identity replaces IRSA. The trust policy uses
  # eks-auth.amazonaws.com as the principal, not the OIDC provider ARN.
  # Permissions here allow the Update Operator to describe/update node groups.

  UpdateOperatorPodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-update-operator-pod-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: UpdateOperatorPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Describe cluster and node group state
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                  - eks:ListUpdates
                  - eks:DescribeUpdate
                Resource: !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
              - Effect: Allow
                Action:
                  - eks:DescribeNodegroup
                  - eks:UpdateNodegroupVersion
                  - eks:UpdateNodegroupConfig
                Resource: !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/${ClusterName}/*/*"
              # Read SSM for latest EKS optimised AMI versions
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: "arn:aws:ssm:*:*:parameter/aws/service/eks/optimized-ami/*"
              # EC2 permissions for drain / cordon coordination
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeAutoScalingInstances
                Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ── EKS Cluster ────────────────────────────────────────────────────────────

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: !Split [",", !Join [",", !Ref PrivateSubnetIds]]
        SecurityGroupIds:
          - !Ref ClusterSecurityGroup
        EndpointPublicAccess: false
        EndpointPrivateAccess: true
      AccessConfig:
        # API + ConfigMap mode allows both aws-auth and access entries
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      Logging: 
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ── EKS Pod Identity Agent Add-on ─────────────────────────────────────────
  #
  # The eks-pod-identity-agent daemonset must be installed before Pod
  # Identity associations can issue credentials to pods.

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

  # ── Additional recommended add-ons ────────────────────────────────────────

  VpcCniAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE

  CoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: SystemNodeGroup
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  # ── System Node Group ──────────────────────────────────────────────────────

  SystemNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - VpcCniAddon
      - KubeProxyAddon
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Sub "${ClusterName}-system"
      NodeRole: !GetAtt EKSNodeRole.Arn
      Subnets: !Ref PrivateSubnetIds
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeGroupDesiredSize
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
      AmiType: BOTTLEROCKET_x86_64
      CapacityType: ON_DEMAND
      UpdateConfig:
        MaxUnavailablePercentage: 33
      Labels:
        role: system
      Tags:
        Environment: !Ref EnvironmentTag
        NodeGroupType: system

  # ── Pod Identity Association ───────────────────────────────────────────────
  #
  # Binds the IAM role to the update-operator service account in the
  # eks-update-operator namespace. When a pod uses that service account,
  # the Pod Identity agent injects temporary credentials automatically.
  # No OIDC provider, no annotation on the service account required.

  UpdateOperatorPodIdentityAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn:
      - PodIdentityAgentAddon
      - SystemNodeGroup
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: eks-update-operator
      ServiceAccount: eks-update-operator
      RoleArn: !GetAtt UpdateOperatorPodRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentTag

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  ClusterName:
    Description: EKS cluster name
    Value: !Ref ClusterName
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EKSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  ClusterEndpoint:
    Description: EKS API server endpoint
    Value: !GetAtt EKSCluster.Endpoint
    Export:
      Name: !Sub "${AWS::StackName}-ClusterEndpoint"

  ClusterCertificateAuthority:
    Description: Base64-encoded cluster CA certificate (not exported due to length limit)
    Value: !GetAtt EKSCluster.CertificateAuthorityData

  NodeRoleArn:
    Description: IAM role ARN for node groups
    Value: !GetAtt EKSNodeRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NodeRoleArn"

  UpdateOperatorPodRoleArn:
    Description: IAM role ARN bound to the Update Operator pod via Pod Identity
    Value: !GetAtt UpdateOperatorPodRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UpdateOperatorPodRoleArn"

  SystemNodeGroupName:
    Description: System managed node group name
    Value: !Ref SystemNodeGroup
    Export:
      Name: !Sub "${AWS::StackName}-SystemNodeGroup"

  PodIdentityAssociationArn:
    Description: >
      Pod Identity association ARN linking the eks-update-operator
      service account to the IAM role.
    Value: !Ref UpdateOperatorPodIdentityAssociation
    Export:
      Name: !Sub "${AWS::StackName}-PodIdentityAssociation"

  KubeconfigCommand:
    Description: AWS CLI command to update local kubeconfig
    Value: !Sub "aws eks update-kubeconfig --region ${AWS::Region} --name ${ClusterName}"